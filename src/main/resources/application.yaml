mponents":{"schemas":{"ChatMessageRequest":{"type":"object","properties":{"message":{"type":"string"}}},"ChatMessageResponse":{"type":"object","properties":{"conversationId":{"type":"string"},"message":{"$ref":"#/components/schemas/Message"}}},"Message":{"type":"object","properties":{"messageType":{"type":"string","enum":["USER","ASSISTANT","SYSTEM","TOOL"]},"metadata":{"type":"object","additionalProperties":{}},"text":{"type":"string"}}}}}}
      The javascript functions should call the api endpoints to send messages and upload files or urls the base url of the api is http://localhost:7020.

      The output should be an html code only with javascript in one file.